[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyFlir"
version = "0.2.0"
description = "Pure-Python driver for FLIR thermal cameras over GigE Vision"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Capponi", email = "lorenzocapponi@outlook.it" }]
keywords = ["flir", "gige", "camera", "imaging", "infrared", "thermal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]

dependencies = [
    "numpy",
    "pyGigEVision",
]

[project.optional-dependencies]
io = ["pysfmov"]
tiff = ["tifffile"]
gui = ["Pillow", "matplotlib"]

[tool.hatch.build.targets.wheel]
packages = ["src/pyflir"]
