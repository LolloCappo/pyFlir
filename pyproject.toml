[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pyFlir"
version = "0.2.0"
description = "Python library for FLIR cameras reading based on GigE protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Lorenzo Capponi", email = "lorenzocapponi@outlook.it" }]
keywords = ["flir", "gige", "camera", "thermal", "infrared", "genicam"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Scientific/Engineering :: Image Processing",
]
dependencies = [
    "pyGigEVision>=0.2.1",
    "numpy",
    "psutil",
]

[project.optional-dependencies]
gui = [
    "matplotlib",
    "Pillow",
]

[project.scripts]
pyflir = "pyflir.cli:main"

